default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [firefly_reports/]
        additional_dependencies:
          - types-requests
          - python-dotenv

  - repo: local
    hooks:
      - id: check-publish
        name: nothing private in the commits to push
        entry: bash tools/check-publish.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
