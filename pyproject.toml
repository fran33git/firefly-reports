[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firefly-iii-reports"
version = "1.0.1"
description = "Generate financial reports (PDF + Excel) from a Firefly III instance"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "fran33git", email = "80598630+fran33git@users.noreply.github.com" }]
keywords = ["firefly-iii", "finance", "reports", "pdf", "excel", "accounting"]
dependencies = [
    "requests>=2.31.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
firefly-reports = "firefly_reports.main:main"

[project.urls]
Homepage = "https://bytesdust.com"
Repository = "https://github.com/fran33git/firefly-reports"
"Bug Tracker" = "https://github.com/fran33git/firefly-reports/issues"

[tool.setuptools.package-data]
firefly_reports = ["translations/*.toml"]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "responses>=0.25.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"firefly_reports/pdf_exporter.py" = ["N806", "E701"]
"firefly_reports/excel_exporter.py" = ["E701"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "openpyxl.*", "matplotlib.*", "dateutil.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["firefly_reports.pdf_exporter", "firefly_reports.excel_exporter", "firefly_reports.demo", "firefly_reports.main"]
disallow_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["firefly_reports"]
omit = ["firefly_reports/demo.py"]
