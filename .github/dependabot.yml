version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/firefly_reports"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bundle low-risk bumps into one PR; majors (e.g. a reportlab X.0.0)
      # stay separate so they get individual review/testing.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # numpy>=2.5.0 requires Python>=3.12; this project's CI matrix still
      # tests 3.11 (see requirements.in). Without this, Dependabot widens
      # the numpy<2.5 constraint on its own whenever a newer release ships,
      # since it treats the pinned line in requirements.in as a direct dep.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Actions bump their major tag often for routine releases; low risk
      # since it's declarative YAML executed by GitHub-hosted runners.
      github-actions:
        patterns:
          - "*"
