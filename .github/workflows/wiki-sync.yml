name: Wiki Sync

on:
  push:
    branches: ["main"]
    paths: ["docs/wiki/**"]

permissions:
  contents: write

jobs:
  sync:
    name: Sync docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Push docs/wiki to wiki repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete docs/wiki/ wiki/
          cd wiki
          git add -A
          git diff --cached --quiet || (
            git commit -m "docs: sync wiki from docs/wiki (${GITHUB_SHA::7})" &&
            git push
          )
