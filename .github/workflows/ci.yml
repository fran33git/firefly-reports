name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the identity check walks the commits of the pull request
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install ruff
      - run: ruff check firefly_reports/ tests/ tools/
      - run: ruff format --check firefly_reports/ tests/ tools/
      # The maintainer's own pull requests only: outside contributors keep their identity.
      - name: Commit identities
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'fran33git'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: tools/check-identity.sh "$BASE..$HEAD"

  types:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install -r firefly_reports/requirements.txt
      - run: pip install mypy types-requests types-PyYAML python-dotenv
      - run: mypy firefly_reports/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, types]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install -r firefly_reports/requirements.txt
      - run: pip install pytest pytest-cov responses beancount
      - run: |
          pytest tests/ \
            --cov=firefly_reports \
            --cov-report=xml \
            --cov-fail-under=90 \
            -v
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install pip-audit
      - run: pip-audit -r firefly_reports/requirements.txt

  # Builds and smoke-tests the Windows exe on every PR/push, so packaging
  # regressions surface before merge, not at release tag time.
  # Mirrors the windows-exe job in release.yml and tools/test-exe.sh —
  # keep the PyInstaller command and the probes in sync.
  windows-exe:
    name: Windows exe smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install -r firefly_reports/requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --name firefly-reports --paths . --add-data "firefly_reports/translations;firefly_reports/translations" firefly_reports/__main__.py
      - name: Smoke test exe
        run: |
          .\dist\firefly-reports.exe --help
          $version = .\dist\firefly-reports.exe --version
          if ($version -notmatch "^firefly-reports \d+\.\d+\.\d+") {
            Write-Error "unexpected --version output: $version"
            exit 1
          }
          # Probe translation loading from the bundle: any invocation past
          # argparse calls i18n.load(). Expect a connection failure here, but
          # never a missing-translation error. Use cmd /c to capture output
          # without letting the probe's non-zero exit code fail this step.
          cmd /c ".\dist\firefly-reports.exe report --year 2025 --url http://127.0.0.1:9 --token dummy > probe.log 2>&1 || exit 0"
          $probe = Get-Content probe.log -Raw
          if ($probe -match "No translation file|FileNotFoundError|_MEI") {
            Write-Error "translations missing from the bundled exe"
            exit 1
          }
          # The 1.x form (no subcommand) still works and warns on stderr.
          cmd /c ".\dist\firefly-reports.exe --year 2025 --url http://127.0.0.1:9 --token dummy > probe_legacy.log 2>&1 || exit 0"
          $legacy = Get-Content probe_legacy.log -Raw
          if ($legacy -notmatch "deprecated" -or $legacy -match "No translation file|FileNotFoundError|_MEI") {
            Write-Error "legacy form probe failed"
            exit 1
          }
          Write-Host "translation and legacy probes passed (expected connection failure only)"
          # Offline end to end run under a legacy console codepage: every report from the built-in data.
          $env:PYTHONIOENCODING = "cp1252"
          .\dist\firefly-reports.exe demo --out demo_out --lang it
          if ($LASTEXITCODE -ne 0) {
            Write-Error "demo run failed"
            exit 1
          }
          $pdfs = (Get-ChildItem demo_out -Filter *.pdf).Count
          if ($pdfs -ne 27) {
            Write-Error "expected 27 PDFs from the demo, got $pdfs"
            exit 1
          }
          Write-Host "demo probe passed ($pdfs PDFs)"

  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install bandit
      - run: bandit -r firefly_reports/ -l -ii --exclude firefly_reports/.venv

  coverage-badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install -r firefly_reports/requirements.txt
      - run: pip install pytest pytest-cov responses beancount
      - run: pytest tests/ --cov=firefly_reports -q
      - name: Generate coverage badge
        run: |
          PCT=$(coverage report --format=total)
          COLOR=$(if [ "$PCT" -ge 80 ]; then echo brightgreen; \
                  elif [ "$PCT" -ge 60 ]; then echo yellow; else echo red; fi)
          curl -sf -o docs/coverage_badge.svg \
            "https://img.shields.io/badge/coverage-${PCT}%25-${COLOR}"
      # main is protected by a ruleset requiring PRs, so the bot cannot push
      # directly: open (or update) a badge PR instead and try to merge it.
      - name: Create or update badge PR
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(ci): update coverage badge"
          title: "chore(ci): update coverage badge"
          body: "Automated update of `docs/coverage_badge.svg` from the latest CI coverage run."
          branch: ci/coverage-badge
          delete-branch: true
      - name: Merge badge PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --squash "${{ steps.cpr.outputs.pull-request-number }}" || \
          gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}" || \
          echo "Badge PR left open for manual merge"
