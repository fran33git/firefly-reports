name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install ruff
      - run: ruff check firefly_reports/
      - run: ruff format --check firefly_reports/

  types:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install -r firefly_reports/requirements.txt
      - run: pip install mypy types-requests python-dotenv
      - run: mypy firefly_reports/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, types]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install -r firefly_reports/requirements.txt
      - run: pip install pytest pytest-cov responses
      - run: |
          pytest tests/ \
            --cov=firefly_reports \
            --cov-report=xml \
            --cov-fail-under=60 \
            -v
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install pip-audit
      - run: pip-audit -r firefly_reports/requirements.txt

  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install bandit
      - run: bandit -r firefly_reports/ -l -ii --exclude firefly_reports/demo.py,firefly_reports/.venv

  coverage-badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install -r firefly_reports/requirements.txt
      - run: pip install pytest pytest-cov responses
      - run: pytest tests/ --cov=firefly_reports -q
      - name: Generate coverage badge
        run: |
          PCT=$(coverage report --format=total)
          COLOR=$(if [ "$PCT" -ge 80 ]; then echo brightgreen; \
                  elif [ "$PCT" -ge 60 ]; then echo yellow; else echo red; fi)
          curl -sf -o docs/coverage_badge.svg \
            "https://img.shields.io/badge/coverage-${PCT}%25-${COLOR}"
      # main is protected by a ruleset requiring PRs, so the bot cannot push
      # directly: open (or update) a badge PR instead and try to merge it.
      - name: Create or update badge PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(ci): update coverage badge"
          title: "chore(ci): update coverage badge"
          body: "Automated update of `docs/coverage_badge.svg` from the latest CI coverage run."
          branch: ci/coverage-badge
          delete-branch: true
      - name: Merge badge PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --squash "${{ steps.cpr.outputs.pull-request-number }}" || \
          gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}" || \
          echo "Badge PR left open for manual merge"
