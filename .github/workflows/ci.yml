name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install ruff
      - run: ruff check firefly_reports/
      - run: ruff format --check firefly_reports/

  types:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install -r firefly_reports/requirements.txt
      - run: pip install mypy types-requests python-dotenv
      - run: mypy firefly_reports/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, types]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install -r firefly_reports/requirements.txt
      - run: pip install pytest pytest-cov responses
      - run: |
          PYTHONPATH=firefly_reports pytest tests/ \
            --cov=firefly_reports \
            --cov-report=xml \
            --cov-fail-under=60 \
            -v
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install pip-audit
      - run: pip-audit -r firefly_reports/requirements.txt

  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install bandit
      - run: bandit -r firefly_reports/ -l -ii --exclude firefly_reports/demo.py,firefly_reports/.venv

  coverage-badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install -r firefly_reports/requirements.txt
      - run: pip install pytest pytest-cov responses
      - run: PYTHONPATH=firefly_reports pytest tests/ --cov=firefly_reports -q
      - name: Generate coverage badge
        run: |
          PCT=$(coverage report --format=total)
          COLOR=$(if [ "$PCT" -ge 80 ]; then echo brightgreen; \
                  elif [ "$PCT" -ge 60 ]; then echo yellow; else echo red; fi)
          curl -sf -o docs/coverage_badge.svg \
            "https://img.shields.io/badge/coverage-${PCT}%25-${COLOR}"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet docs/coverage_badge.svg || (
            git add docs/coverage_badge.svg &&
            git commit -m "chore(ci): update coverage badge" &&
            git push
          )
