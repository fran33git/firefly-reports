name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual run: builds artifacts only, never publishes

permissions:
  contents: write

jobs:
  check-version:
    name: Check tag matches pyproject version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run: skipping tag/version check"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag '$TAG' does not match pyproject version '$VER'"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "firefly_reports/requirements.txt"
      - run: pip install -r firefly_reports/requirements.txt
      - run: pip install pytest pytest-cov responses
      - run: pytest tests/ --cov=firefly_reports --cov-fail-under=60 -q

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: [check-version, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    needs: [check-version, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r firefly_reports/requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --name firefly-reports --paths . --collect-data firefly_reports firefly_reports/main.py
      - name: Smoke test exe
        run: .\dist\firefly-reports.exe --help
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/firefly-reports.exe

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [pypi, windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/dist/* \
            artifacts/windows-exe/firefly-reports.exe \
            --title "firefly-reports ${GITHUB_REF_NAME}" \
            --generate-notes
