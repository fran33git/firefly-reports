name: Greet first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue on firefly-reports! I'll take
            a look as soon as I can. If it's a bug report, extra details
            (Firefly III version, the exact command you ran, and any error
            output) help a lot.
          pr-message: >
            Thanks for your first pull request! Please make sure
            `PYTHONPATH=firefly_reports pytest tests/ -v`, `ruff check
            firefly_reports/` and `mypy firefly_reports/` all pass locally —
            see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the full
            checklist. I'll review it soon.
