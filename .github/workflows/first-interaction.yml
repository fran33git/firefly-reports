name: Greet first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greeting:
    # Maintainers do not need the welcome message on their own issues and PRs.
    if: github.actor != github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >
            Thanks for opening your first issue on firefly-reports! I'll take
            a look as soon as I can. If it's a bug report, extra details
            (Firefly III version, the exact command you ran, and any error
            output) help a lot.
          pr_message: >
            Thanks for your first pull request! Please make sure
            `pytest tests/ -v`, `ruff check firefly_reports/` and
            `mypy firefly_reports/` all pass locally. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the full
            checklist. I'll review it soon.
