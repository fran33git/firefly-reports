deprecated_no_subcommand = "Warning: running reports without a subcommand is deprecated and will stop working in firefly-reports 3.0. Use: {command}"
deprecated_module        = "Warning: '{old}' is deprecated and will be removed in firefly-reports 3.0. Use: {new}"
err_url_required         = "Firefly III URL is required. Use --url, set FIREFLY_URL, or add url to firefly-reports.toml."
err_url_invalid          = "invalid Firefly III URL '{url}'. It must include the scheme, e.g. https://firefly.example.com"
err_token_required       = "token is required. Use --token, set FIREFLY_TOKEN, add it to a .env file, or add token to firefly-reports.toml."
err_invalid_date         = "invalid date for {flag}: '{value}' (expected format YYYY-MM-DD)."
err_year_and_range       = "use either --year or --start/--end, not both."
err_missing_period       = "provide --year YYYY (full year, all reports) or both --start and --end."
hint_init                = "Run 'firefly-reports init' to create a config file."
err_start_after_end      = "--start ({start}) must not be after --end ({end})."
err_config_malformed     = "Config error: firefly-reports.toml is malformed — {error}"
files_failed             = "[!] {count} files failed: {files}"
rerun_debug              = "    -> Re-run with --debug for detailed error log."
